# Auth service. Requires eureka + config (and the external Supabase DB via ../.env).
services:
  mcsv-auth:
    build:
      context: ..
      dockerfile: mcsv-auth/Dockerfile
    image: crm/mcsv-auth:latest
    container_name: mcsv-auth
    ports:
      - "9092:9092"
    env_file:
      - ../.env
    environment:
      CONFIG_SERVER_URI: http://mcsv-config:8888
      EUREKA_SERVER: http://mcsv-eureka:8761/eureka/
    restart: unless-stopped
    networks:
      - crm-network

networks:
  crm-network:
    external: true

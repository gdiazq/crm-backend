# API gateway. Start after eureka + config.
# Redis is external (Upstash); the gateway connects via REDIS_URL from ../.env.
services:
  mcsv-gateway:
    build:
      context: ..
      dockerfile: mcsv-gateway/Dockerfile
    image: crm/mcsv-gateway:latest
    container_name: mcsv-gateway
    ports:
      - "9090:9090"
    env_file:
      - ../.env
    environment:
      EUREKA_SERVER: http://mcsv-eureka:8761/eureka/
    restart: unless-stopped
    networks:
      - crm-network

networks:
  crm-network:
    name: crm-network
    driver: bridge

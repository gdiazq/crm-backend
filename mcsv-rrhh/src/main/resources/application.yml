server:
    port: 9096

spring:
    application:
        name: mcsv-rrhh

    config:
        import: "configserver:"

    servlet:
        multipart:
            enabled: true
            max-file-size: 10MB
            max-request-size: 55MB

    cloud:
        config:
            uri: ${CONFIG_SERVER_URI:http://localhost:8888}

info:
  app:
    name: rrhh Microservicio Server
    description: Microservicio para manejar recursos humanos
    version: 1.0.0

# Configuración para Documentation swagger
openapi:
    service:
        title: rrhh-service doc
        version: 1.0.0
        url: ${URLAPI:http://localhost:9090}/v1/api/rrhh

aws:
    s3:
        enabled: true
        bucket: ${AWS_S3_BUCKET:crm-uploads}
        region: ${AWS_REGION:us-east-1}
        access-key: ${AWS_ACCESS_KEY:}
        secret-key: ${AWS_SECRET_KEY:}

overtime:
    max-hours-per-block: ${OVERTIME_MAX_HOURS_PER_BLOCK:12.00}

springdoc:
  api-docs:
    path: /api/api-docs/rrhh
  swagger-ui:
    path: /api-docs/swagger-ui.html

app:
    security:
        jwt:
            enabled: true
            exclude-paths:
                - /api/api-docs/**
                - /api-docs/**
                - /v3/api-docs/**
                - /swagger-ui/**
                - /swagger-ui.html

# RRHH service. Requires eureka + config (and the external Supabase DB via ../.env).
services:
  mcsv-rrhh:
    build:
      context: ..
      dockerfile: mcsv-rrhh/Dockerfile
    image: crm/mcsv-rrhh:latest
    container_name: mcsv-rrhh
    ports:
      - "9096:9096"
    env_file:
      - ../.env
    environment:
      CONFIG_SERVER_URI: http://mcsv-config:8888
      EUREKA_SERVER: http://mcsv-eureka:8761/eureka/
    restart: unless-stopped
    networks:
      - crm-network

networks:
  crm-network:
    name: crm-network
    driver: bridge

# Project service. Requires eureka + config (and the external Supabase DB via ../.env).
services:
  mcsv-project:
    build:
      context: ..
      dockerfile: mcsv-project/Dockerfile
    image: crm/mcsv-project:latest
    container_name: mcsv-project
    ports:
      - "9097:9097"
    env_file:
      - ../.env
    environment:
      CONFIG_SERVER_URI: http://mcsv-config:8888
      EUREKA_SERVER: http://mcsv-eureka:8761/eureka/
    restart: unless-stopped
    networks:
      - crm-network

networks:
  crm-network:
    name: crm-network
    driver: bridge

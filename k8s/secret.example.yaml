# REFERENCE ONLY — do not apply this with real values committed.
#
# The real Secret is created straight from your existing .env (which already holds the
# Supabase DB creds, Upstash REDIS_URL, JWT SECRET_KEY and AWS keys):
#
#   kubectl create secret generic crm-secrets --from-env-file=.env -n crm
#
# CONFIG_SERVER_URI / EUREKA_SERVER from .env point at localhost; the ConfigMap overrides
# them with the in-cluster values, so they are harmless here.
#
# Production: replace this with the External Secrets Operator syncing from AWS Secrets
# Manager, so secrets never live in the cluster manifests.
apiVersion: v1
kind: Secret
metadata:
  name: crm-secrets
  namespace: crm
type: Opaque
stringData:
  JDBC_URL: "jdbc:postgresql://<host>:5432/postgres"
  DB_USER_NAME: "REPLACE_ME"
  DB_PASSWORD: "REPLACE_ME"
  SECRET_KEY: "REPLACE_ME"
  REDIS_URL: "rediss://default:<token>@<host>.upstash.io:6379"
  AWS_ACCESS_KEY: "REPLACE_ME"
  AWS_SECRET_KEY: "REPLACE_ME"
  AWS_REGION: "us-east-1"
  AWS_S3_BUCKET: "crm-uploads"
  AWS_SQS_EMAIL_QUEUE_URL: "REPLACE_ME"
  AWS_EVENTBRIDGE_BUS_NAME: "crm-events"
  EMAIL_TOKEN: "REPLACE_ME"

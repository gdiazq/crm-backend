apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcsv-user
  namespace: crm
  labels: { app: mcsv-user }
spec:
  replicas: 1
  selector:
    matchLabels: { app: mcsv-user }
  template:
    metadata:
      labels: { app: mcsv-user }
    spec:
      serviceAccountName: crm-aws
      containers:
        - name: mcsv-user
          image: crm/mcsv-user:latest
          ports:
            - containerPort: 9091
          envFrom:
            - secretRef: { name: crm-secrets }
            - configMapRef: { name: crm-config }
          startupProbe:
            httpGet: { path: /actuator/health, port: 9091 }
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health, port: 9091 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 9091 }
            periodSeconds: 15
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 1Gi }

apiVersion: v1
kind: ServiceAccount
metadata:
  name: crm-aws
  namespace: crm
  # Production (recommended): annotate with an IRSA role so pods assume an IAM role and
  # you can drop the static AWS_ACCESS_KEY/AWS_SECRET_KEY from the Secret entirely.
  #   annotations:
  #     eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/crm-app-irsa

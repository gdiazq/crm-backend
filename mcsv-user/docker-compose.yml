# User service. Requires eureka + config (and the external Supabase DB via ../.env).
services:
  mcsv-user:
    build:
      context: ..
      dockerfile: mcsv-user/Dockerfile
    image: crm/mcsv-user:latest
    container_name: mcsv-user
    ports:
      - "9091:9091"
    env_file:
      - ../.env
    environment:
      CONFIG_SERVER_URI: http://mcsv-config:8888
      EUREKA_SERVER: http://mcsv-eureka:8761/eureka/
    restart: unless-stopped
    networks:
      - crm-network

networks:
  crm-network:
    name: crm-network
    driver: bridge
